      .blk.pink { background: var(--pink); color: #fff; }
      .blk.yellow { background: var(--yellow); }
      .tagline { display: inline-block; font-family: var(--font-ui); font-weight: 900; font-size: 34px; letter-spacing: 0.1em; padding: 10px 26px;
                 border-radius: 999px; background: #000; color: var(--lime); margin-bottom: 18px; }
      .pill { display: inline-flex; align-items: center; gap: 16px; padding: 16px 30px; border-radius: 999px; font-family: var(--font-ui);
              font-weight: 900; font-size: 41px; color: #000; background: #fff; box-shadow: 0 12px 0 rgba(0,0,0,0.35); white-space: nowrap; }
      .pill svg { width: 45px; height: 45px; }
      .pill.lime { background: var(--lime); } .pill.pink { background: var(--pink); color: #fff; } .pill.yellow { background: var(--yellow); }
